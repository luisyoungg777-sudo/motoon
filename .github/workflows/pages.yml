name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se você empurrar dois commits seguidos, o segundo cancela o primeiro em vez
# de os dois disputarem o mesmo deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Se o teste ou o typecheck quebrar, nada vai pro ar.
      - name: Testes
        id: testes
        run: |
          set -o pipefail
          npm test 2>&1 | tee saida-teste.txt

      # O log completo de um job só é legível para quem tem admin no
      # repositório — a API devolve 403 para todo mundo mais. Sem este passo,
      # um teste que quebra só aqui aparece lá fora como "Process completed
      # with exit code 1" e nada além disso, o que é impossível de depurar e
      # impossível de pedir ajuda mostrando.
      #
      # A anotação, ao contrário, é pública: sai na página do commit e na API
      # sem token nenhum. Então a saída do teste vira anotação quando falha.
      - name: Mostra a falha do teste na anotação
        if: failure() && steps.testes.outcome == 'failure'
        run: |
          RESUMO=$(tail -c 3000 saida-teste.txt \
            | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' \
            | awk '{printf "%s%%0A", $0}')
          echo "::error title=npm test falhou::${RESUMO}"

      # As chaves vêm de .env.production, versionado no repositório.
      #
      # NÃO declare `env:` com `${{ secrets.X }}` aqui. Secret ausente vira
      # string vazia, e variável de ambiente vazia tem precedência sobre o
      # arquivo .env no Vite — o build sairia sem as chaves justamente por
      # causa da linha que deveria fornecê-las. Foi o que aconteceu.
      #
      # Para usar secrets em vez do arquivo, apague .env.production e só
      # então declare o bloco env: aqui.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
