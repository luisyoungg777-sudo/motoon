name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se você empurrar dois commits seguidos, o segundo cancela o primeiro em vez
# de os dois disputarem o mesmo deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Se o teste ou o typecheck quebrar, nada vai pro ar.
      - run: npm test

      # As chaves do Supabase vêm dos secrets do repositório. Sem elas o
      # build passa igual — o app publicado só fica sem backup na nuvem, e
      # a tela de conta explica isso. Nada quebra.
      #
      # A chave publicável é pública por definição: ela vai embutida no
      # JavaScript entregue a qualquer visitante. Quem protege os dados é a
      # RLS no banco. Ainda assim ela entra por secret, para não ficar
      # versionada no repositório.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
